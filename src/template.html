<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Red+Hat+Mono:ital,wght@0,300..700;1,300..700&display=swap');
    </style>
    <title>To Do App</title>
</head>
<body>
    <header>
        <h1>TO DO LIST</h1>
    </header>
    <aside class="sidebar">
        <nav class="projects">
            <button id="inbox" class="project">Inbox</button>
        </nav>
        <form class="add-new">
            <label for="add-new-project" class="sr-only">Add new project</label>
            <input type="text" name="project-title" placeholder="new project" id="project-title" required/>
            <button id="add-project-button">+</button>
        </form>
    </aside>
    <main>
        <div id="list"></div>
        <div id="add-new-task">
            <button id="add-task-button">Add a task</button>
            <dialog id="add-task-dialog"></dialog>
        </div>
    </main>
</body>
</html>
