<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>@import url(https://fonts.googleapis.com/css2?family=Red+Hat+Mono:ital,wght@0,300..700;1,300..700&display=swap);</style><title>To Do App</title><script defer="defer" src="main.js"></script></head><body><header><h1>TO DO LIST</h1></header><aside class="sidebar"><nav class="projects"></nav><form class="add-new"><label for="project-title" class="sr-only">Add new project</label> <input name="project-title" placeholder="new project" id="project-title"/> <button id="add-project-button">+</button></form></aside><main><div class="list"></div><dialog class="details-dialog" id="todo-details"></dialog><div id="add-new-task"><button id="add-task-button">Add a task</button><dialog id="add-task-dialog"><button id="add-task-form" class="cancel" aria-label="cancel">X</button><div class="select-container"><div class="container"><label for="project">Project</label> <select id="project"></select></div><div class="container"><label for="priority">Priority</label> <select id="priority"></select></div></div><div class="container"><label for="title" class="required">Title(Required)</label> <input id="title" placeholder="To do" required/></div><div class="container"><label for="description">Description</label> <textarea id="description" cols="3" placeholder="Briefly describe the task..." maxlength="100"/></div><div class="container"><label for="due-date" class="required">Due-date(Required)</label> <input id="due-date" type="date" required="true"/></div><div class="container"><label for="notes">Notes</label> <textarea id="notes" placeholder="Things to remember..."></textarea></div><button id="submit-add-form" class="submit">Done</button></dialog></div></main></body></html>
